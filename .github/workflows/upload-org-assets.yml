name: Upload org assets

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do everything except the actual file upload)'
        type: boolean
        default: false
      upload_org_avatar:
        description: 'Upload the bumtrips org avatar'
        type: boolean
        default: true
      upload_repo_social_preview:
        description: 'Upload the repo social preview'
        type: boolean
        default: true
  push:
    branches: [master]
    paths:
      - 'assets/org/**'
      - '.github/workflows/upload-org-assets.yml'
      - 'scripts/upload-org-assets.js'

permissions:
  contents: read

concurrency:
  group: upload-org-assets
  cancel-in-progress: false

jobs:
  upload:
    name: Upload via Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.48.0
          npx playwright install --with-deps chromium

      - name: Upload assets
        env:
          AUTH_STATE_B64: ${{ secrets.AUTH_STATE_B64 }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          UPLOAD_ORG_AVATAR: ${{ inputs.upload_org_avatar || 'true' }}
          UPLOAD_SOCIAL_PREVIEW: ${{ inputs.upload_repo_social_preview || 'true' }}
        run: node scripts/upload-org-assets.js

      - name: Summary
        if: always()
        run: |
          echo "### Upload org assets" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Dry run: \`${{ inputs.dry_run || 'false' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Org avatar uploaded: \`${{ inputs.upload_org_avatar || 'true' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Social preview uploaded: \`${{ inputs.upload_repo_social_preview || 'true' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Re-capture AUTH_STATE_B64 if the run fails with 'sign in to GitHub'." >> $GITHUB_STEP_SUMMARY
