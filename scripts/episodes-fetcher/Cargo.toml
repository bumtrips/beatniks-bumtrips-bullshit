[package]
name = "episodes-fetcher"
version = "0.2.0"
edition = "2021"
description = "Backend fetcher for bumtrips podcast episodes. stdlib only, no deps."
license = "MIT"

# Per org rule: Rust with no libraries. stdlib only.
[dependencies]

[[bin]]
name = "episodes-fetcher"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
